<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐍 科比直升机贪吃蛇 | 冰红茶 + 曼巴小曲</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #1a2a32; min-height: 100vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center; font-family: 'Segoe UI', Roboto, sans-serif;
        }
        .game-container {
            background: #0f1920; padding: 1.2rem 1.2rem 1.5rem; border-radius: 2rem;
            box-shadow: 0 20px 30px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.05);
            display: flex; flex-direction: column; align-items: center; position: relative;
        }
        .score-panel {
            display: flex; justify-content: space-between; align-items: center; width: 100%;
            margin-bottom: 0.8rem; padding: 0 0.5rem; color: #d4e9ff; font-weight: bold;
            font-size: 1.5rem; letter-spacing: 1px; text-shadow: 0 2px 3px rgba(0,0,0,0.5);
        }
        .score-panel span {
            background: #1f3a45; padding: 0.4rem 1.2rem; border-radius: 3rem;
            box-shadow: inset 0 0 5px #00000033, 0 4px 0 #0b1418; color: #b9e6ff;
        }
        canvas {
            display: block; border-radius: 1.2rem; background-color: #1e2f38;
            box-shadow: inset 0 0 0 3px #2a404b, 0 12px 18px -6px black;
            width: 600px; height: 600px; image-rendering: crisp-edges;
        }
        .hint {
            margin-top: 1rem; color: #7c9ca8; font-size: 0.9rem; letter-spacing: 0.5px;
            display: flex; gap: 1.2rem; flex-wrap: wrap; justify-content: center;
        }
        .hint kbd {
            background: #2a404b; color: #d1ecff; padding: 0.2rem 0.7rem; border-radius: 0.6rem;
            font-weight: bold; font-size: 0.9rem; box-shadow: 0 2px 0 #0a1418;
        }
        @keyframes praiseFloat {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
            15% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
            30% { transform: translate(-50%, -50%) scale(1); }
            80% { opacity: 1; transform: translate(-50%, -120%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -180%) scale(0.8); }
        }
        .praise-message {
            position: absolute; pointer-events: none; font-size: 2.2rem; font-weight: 900;
            color: #ffe66d; text-shadow: 0 0 15px #ff9f43, 0 0 30px #ff6b6b, 0 4px 0 #b34700;
            white-space: nowrap; animation: praiseFloat 1.6s ease-out forwards;
            z-index: 10; letter-spacing: 2px;
        }
        .music-toggle {
            position: absolute; top: 0.8rem; right: 1.2rem; background: #2a404b; border: none;
            color: #d1ecff; font-size: 1.2rem; width: 2.6rem; height: 2.6rem; border-radius: 50%;
            cursor: pointer; box-shadow: 0 3px 0 #0a1418; transition: all 0.15s ease;
            display: flex; align-items: center; justify-content: center; z-index: 20;
        }
        .music-toggle:hover { background: #3a5563; transform: translateY(-1px); }
        .music-toggle:active { transform: translateY(2px); box-shadow: 0 1px 0 #0a1418; }
        .speed-indicator {
            position: absolute; bottom: 1.5rem; right: 1.5rem; font-size: 1rem;
            color: #ffd93d; font-weight: bold; text-shadow: 0 0 8px rgba(255,217,61,0.5);
            opacity: 0; transition: opacity 0.15s; pointer-events: none;
        }
        .speed-indicator.active { opacity: 1; }
    </style>
</head>
<body>
    <div class="game-container">
        <button class="music-toggle" id="musicToggle" title="切换背景音乐">🎵</button>
        <div class="score-panel">
            <span>🧃 得分</span>
            <span id="scoreDisplay">0</span>
        </div>
        <canvas id="gameCanvas" width="600" height="600"></canvas>
        <div class="hint">
            <span><kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> 移动</span>
            <span><kbd>空格</kbd> 长按加速</span>
            <span>🌀 无尽穿墙</span>
        </div>
        <div class="speed-indicator" id="speedIndicator">⚡ 加速中</div>
    </div>

    <script>
        (function () {
            const CANVAS_SIZE = 600;
            const GRID_SIZE = 20;
            const TILE_COUNT = CANVAS_SIZE / GRID_SIZE;
            const BASE_MOVES_PER_SECOND = 8;
            const FAST_MOVES_PER_SECOND = 18;

            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const scoreDisplay = document.getElementById('scoreDisplay');
            const musicToggle = document.getElementById('musicToggle');
            const speedIndicator = document.getElementById('speedIndicator');
            const gameContainer = document.querySelector('.game-container');

            const PRAISE_MESSAGES = [
                'MAN!', 'MAMBA!', 'PIU PIU PIU!', 'KOBE!', '冰红茶!',
                'WHAT CAN I SAY', 'MAMBA OUT!', '直升机起飞!', 'GOOD!', 'EXCELLENT!'
            ];

            let snake = [];
            let food = { x: 0, y: 0 };
            let direction = 'RIGHT';
            let nextDirection = 'RIGHT';
            let score = 0;
            let gameOver = false;
            let gameWin = false;
            let lastMoveTime = 0;
            let animationFrameId = null;
            let isBoosting = false;
            let gridPatternCanvas = null;

            let audioCtx = null;
            let musicGainNode = null;
            let musicPlaying = false;
            let musicToggleState = true;
            let musicSequenceTimeout = null;

            function initGame() {
                const startX = Math.floor(TILE_COUNT / 2);
                const startY = Math.floor(TILE_COUNT / 2);
                snake = [
                    { x: startX, y: startY },
                    { x: startX - 1, y: startY },
                    { x: startX - 2, y: startY }
                ];
                direction = 'RIGHT';
                nextDirection = 'RIGHT';
                score = 0;
                updateScoreDisplay();
                gameOver = false;
                gameWin = false;
                isBoosting = false;
                speedIndicator.classList.remove('active');
                generateRandomFood();
                lastMoveTime = performance.now();

                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                document.querySelectorAll('.praise-message').forEach(el => el.remove());

                animationFrameId = requestAnimationFrame(gameLoop);
                if (musicToggleState && !musicPlaying) startBackgroundMusic();
                drawGame();
            }

            function generateRandomFood() {
                const maxAttempts = 2000;
                let attempts = 0;
                let newFood = null;
                while (attempts < maxAttempts) {
                    const randX = Math.floor(Math.random() * TILE_COUNT);
                    const randY = Math.floor(Math.random() * TILE_COUNT);
                    if (!snake.some(seg => seg.x === randX && seg.y === randY)) {
                        newFood = { x: randX, y: randY };
                        break;
                    }
                    attempts++;
                }
                if (!newFood) {
                    const occupied = Array(TILE_COUNT).fill().map(() => Array(TILE_COUNT).fill(false));
                    snake.forEach(seg => {
                        if (seg.x >= 0 && seg.x < TILE_COUNT && seg.y >= 0 && seg.y < TILE_COUNT) occupied[seg.y][seg.x] = true;
                    });
                    outer:
                    for (let y = 0; y < TILE_COUNT; y++) {
                        for (let x = 0; x < TILE_COUNT; x++) {
                            if (!occupied[y][x]) { newFood = { x, y }; break outer; }
                        }
                    }
                }
                if (newFood) food = newFood;
                else { gameWin = true; gameOver = true; }
            }

            function updateScoreDisplay() { scoreDisplay.textContent = score; }

            function showPraise() {
                const message = PRAISE_MESSAGES[Math.floor(Math.random() * PRAISE_MESSAGES.length)];
                const praiseEl = document.createElement('div');
                praiseEl.className = 'praise-message';
                praiseEl.textContent = message;
                praiseEl.style.left = (20 + Math.random() * 60) + '%';
                praiseEl.style.top = (20 + Math.random() * 30) + '%';
                praiseEl.style.transform = 'translate(-50%, -50%)';
                if (message.length > 10) praiseEl.style.fontSize = '1.7rem';
                gameContainer.appendChild(praiseEl);
                setTimeout(() => { if (praiseEl.parentNode) praiseEl.remove(); }, 1700);
            }

            function moveSnake() {
                if (gameOver) return;
                if (nextDirection === 'UP' && direction !== 'DOWN') direction = 'UP';
                else if (nextDirection === 'DOWN' && direction !== 'UP') direction = 'DOWN';
                else if (nextDirection === 'LEFT' && direction !== 'RIGHT') direction = 'LEFT';
                else if (nextDirection === 'RIGHT' && direction !== 'LEFT') direction = 'RIGHT';

                const head = snake[0];
                const newHead = { x: head.x, y: head.y };
                switch (direction) {
                    case 'RIGHT': newHead.x++; break;
                    case 'LEFT':  newHead.x--; break;
                    case 'UP':    newHead.y--; break;
                    case 'DOWN':  newHead.y++; break;
                }

                if (newHead.x < 0) newHead.x = TILE_COUNT - 1;
                else if (newHead.x >= TILE_COUNT) newHead.x = 0;
                if (newHead.y < 0) newHead.y = TILE_COUNT - 1;
                else if (newHead.y >= TILE_COUNT) newHead.y = 0;

                const isEating = (newHead.x === food.x && newHead.y === food.y);
                snake.unshift(newHead);
                if (!isEating) snake.pop();
                else {
                    score += 10;
                    updateScoreDisplay();
                    if (score % 10 === 0) { showPraise(); playEatSound(); }
                    generateRandomFood();
                    if (gameOver) return;
                }

                for (let i = 1; i < snake.length; i++) {
                    if (snake[i].x === newHead.x && snake[i].y === newHead.y) {
                        gameOver = true;
                        stopBackgroundMusic();
                        return;
                    }
                }
            }

            function createGridPattern() {
                const offscreen = document.createElement('canvas');
                offscreen.width = CANVAS_SIZE; offscreen.height = CANVAS_SIZE;
                const offCtx = offscreen.getContext('2d');
                offCtx.fillStyle = '#1e2f38'; offCtx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
                offCtx.strokeStyle = '#2a404b'; offCtx.lineWidth = 0.8;
                for (let i = 0; i <= TILE_COUNT; i++) {
                    offCtx.beginPath(); offCtx.moveTo(i * GRID_SIZE, 0); offCtx.lineTo(i * GRID_SIZE, CANVAS_SIZE); offCtx.stroke();
                    offCtx.beginPath(); offCtx.moveTo(0, i * GRID_SIZE); offCtx.lineTo(CANVAS_SIZE, i * GRID_SIZE); offCtx.stroke();
                }
                return offscreen;
            }

            // 绘制冰红茶
            function drawIceTea(cx, cy, r) {
                ctx.save();
                ctx.shadowColor = '#ff8c1a'; ctx.shadowBlur = 10;
                const grad = ctx.createLinearGradient(cx - r, cy - r, cx + r, cy + r);
                grad.addColorStop(0, '#ffaa33'); grad.addColorStop(1, '#b33c00');
                ctx.beginPath(); ctx.roundRect(cx - r * 0.6, cy - r * 0.8, r * 1.2, r * 1.6, r * 0.3);
                ctx.fillStyle = grad; ctx.fill();
                ctx.beginPath(); ctx.roundRect(cx - r * 0.3, cy - r * 1.1, r * 0.6, r * 0.3, r * 0.1);
                ctx.fillStyle = '#ffcc33'; ctx.fill();
                ctx.shadowBlur = 0;
                ctx.beginPath(); ctx.roundRect(cx - r * 0.5, cy + r * 0.1, r * 1.0, r * 0.4, r * 0.1);
                ctx.fillStyle = '#ffffff'; ctx.fill();
                ctx.fillStyle = '#e86a17';
                ctx.fillRect(cx - r * 0.3, cy + r * 0.2, r * 0.6, r * 0.05);
                ctx.fillRect(cx - r * 0.2, cy + r * 0.3, r * 0.4, r * 0.05);
                ctx.restore();
            }

            // 绘制“科比直升机”梗图蛇头
            function drawKobeHelicopterHead(cx, cy, size, dir) {
                ctx.save();
                ctx.translate(cx, cy);
                if (dir === 'RIGHT') ctx.rotate(0);
                else if (dir === 'DOWN') ctx.rotate(Math.PI / 2);
                else if (dir === 'LEFT') ctx.rotate(Math.PI);
                else if (dir === 'UP') ctx.rotate(-Math.PI / 2);

                // 1. 脸部（棕色圆脸）
                ctx.beginPath();
                ctx.arc(0, size * 0.1, size * 0.55, 0, Math.PI * 2);
                ctx.fillStyle = '#7a4b2c'; 
                ctx.fill();
                ctx.lineWidth = 1.5; ctx.strokeStyle = '#4a2c10'; ctx.stroke();

                // 2. 灿烂笑容
                ctx.beginPath();
                ctx.arc(0, size * 0.3, size * 0.3, 0.1 * Math.PI, 0.9 * Math.PI);
                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = size * 0.08; ctx.lineCap = 'round'; ctx.stroke();
                // 牙齿
                ctx.fillStyle = '#ffffff';
                ctx.beginPath(); ctx.roundRect(-size * 0.15, size * 0.3, size * 0.3, size * 0.12, 2); ctx.fill();

                // 3. 眼睛
                ctx.fillStyle = '#111111';
                ctx.beginPath(); ctx.arc(-size * 0.2, size * 0.05, size * 0.06, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(size * 0.2, size * 0.05, size * 0.06, 0, Math.PI * 2); ctx.fill();

                // 4. 帽子（紫色迷彩棒球帽）
                ctx.beginPath();
                ctx.arc(0, -size * 0.1, size * 0.6, Math.PI * 1.05, Math.PI * 1.95);
                ctx.fillStyle = '#6a0dad'; // 紫色底
                ctx.fill();
                // 帽檐
                ctx.beginPath();
                ctx.ellipse(size * 0.4, -size * 0.1, size * 0.35, size * 0.12, 0, 0, Math.PI * 2);
                ctx.fillStyle = '#4b0082'; ctx.fill();

                // 迷彩斑块
                ctx.fillStyle = '#ff69b4'; // 粉色斑点
                ctx.beginPath(); ctx.arc(-size * 0.2, -size * 0.25, size * 0.1, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(size * 0.15, -size * 0.35, size * 0.08, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#ffd700'; // 黄色斑点
                ctx.beginPath(); ctx.arc(-size * 0.4, -size * 0.1, size * 0.06, 0, Math.PI * 2); ctx.fill();

                // 5. 头顶螺旋桨
                const time = performance.now() / 1000;
                const angle = time * 15; // 快速旋转
                ctx.save();
                ctx.translate(0, -size * 0.75);
                ctx.rotate(angle);
                
                // 桨叶
                ctx.fillStyle = '#ffff00';
                ctx.beginPath(); ctx.roundRect(-size * 0.6, -size * 0.05, size * 1.2, size * 0.1, 2); ctx.fill();
                ctx.beginPath(); ctx.roundRect(-size * 0.05, -size * 0.6, size * 0.1, size * 1.2, 2); ctx.fill();
                
                // 中心轴
                ctx.fillStyle = '#333333';
                ctx.beginPath(); ctx.arc(0, 0, size * 0.12, 0, Math.PI * 2); ctx.fill();
                ctx.restore();

                // 螺旋桨杆
                ctx.beginPath();
                ctx.moveTo(0, -size * 0.5);
                ctx.lineTo(0, -size * 0.75);
                ctx.strokeStyle = '#888888'; ctx.lineWidth = 2; ctx.stroke();

                ctx.restore();
            }

            function drawGame() {
                if (!gridPatternCanvas) gridPatternCanvas = createGridPattern();
                ctx.drawImage(gridPatternCanvas, 0, 0);

                const fx = food.x * GRID_SIZE + GRID_SIZE / 2;
                const fy = food.y * GRID_SIZE + GRID_SIZE / 2;
                drawIceTea(fx, fy, GRID_SIZE * 0.45);

                snake.forEach((seg, i) => {
                    const x = seg.x * GRID_SIZE;
                    const y = seg.y * GRID_SIZE;
                    const cx = x + GRID_SIZE / 2;
                    const cy = y + GRID_SIZE / 2;

                    if (i === 0) {
                        drawKobeHelicopterHead(cx, cy, GRID_SIZE, direction);
                    } else {
                        // 蛇身：湖人紫金
                        const pad = 2;
                        const hue = 280;
                        const light = 55 - (i * 1.5) % 25;
                        ctx.fillStyle = `hsl(${hue}, 70%, ${light}%)`;
                        ctx.beginPath();
                        ctx.roundRect(x + pad, y + pad, GRID_SIZE - pad * 2, GRID_SIZE - pad * 2, 4);
                        ctx.fill();
                        if (i % 2 === 0) {
                            ctx.fillStyle = 'rgba(255, 204, 51, 0.6)';
                            ctx.beginPath();
                            ctx.roundRect(x + pad + 3, y + pad + 3, GRID_SIZE - pad * 2 - 6, 3, 2);
                            ctx.fill();
                        }
                    }
                });

                if (gameOver) {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                    ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
                    ctx.font = 'bold 46px "Segoe UI", Arial';
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillStyle = '#ffcc00'; ctx.shadowColor = '#000'; ctx.shadowBlur = 10;
                    ctx.fillText(gameWin ? '🎉 你赢了！' : '💀 MANBA OUT', CANVAS_SIZE / 2, CANVAS_SIZE / 2 - 20);
                    ctx.font = '22px Arial'; ctx.fillStyle = '#ffffff';
                    ctx.fillText('按方向键重新开始', CANVAS_SIZE / 2, CANVAS_SIZE / 2 + 40);
                    ctx.shadowBlur = 0;
                }
            }

            function gameLoop(now) {
                if (!gameOver) {
                    const speed = isBoosting ? FAST_MOVES_PER_SECOND : BASE_MOVES_PER_SECOND;
                    if (now - lastMoveTime >= 1000 / speed) {
                        moveSnake(); lastMoveTime = now;
                    }
                }
                drawGame();
                animationFrameId = requestAnimationFrame(gameLoop);
            }

            // ==================== 音频系统 ====================
            function initAudio() {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    musicGainNode = audioCtx.createGain();
                    musicGainNode.gain.value = 0.15;
                    musicGainNode.connect(audioCtx.destination);
                }
                if (audioCtx.state === 'suspended') audioCtx.resume();
            }

            function playEatSound() {
                if (!audioCtx) return;
                const t = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(1046.5, t);
                osc.frequency.setValueAtTime(1318.5, t + 0.08);
                gain.gain.setValueAtTime(0.1, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(t); osc.stop(t + 0.3);
            }

            // 曼巴小曲（抽象合成器旋律）
            const MANBA_NOTES = [
                [880.00, 0.15], [880.00, 0.15], [880.00, 0.15], [1046.5, 0.3], // piu piu piu (高音)
                [523.25, 0.15], [523.25, 0.15], [523.25, 0.15], [659.25, 0.3], // man man man (中音)
                [880.00, 0.15], [880.00, 0.15], [880.00, 0.15], [1046.5, 0.3],
                [392.00, 0.4], [440.00, 0.4], [523.25, 0.6]
            ];

            function playManbaNote(freq, startTime, duration) {
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                // 使用方波+锯齿波混合，制造电子感
                osc.type = 'sawtooth'; 
                osc.frequency.value = freq;

                // 包络
                gain.gain.setValueAtTime(0, startTime);
                gain.gain.linearRampToValueAtTime(0.4, startTime + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

                osc.connect(gain); gain.connect(musicGainNode);
                osc.start(startTime); osc.stop(startTime + duration + 0.1);
            }

            function startBackgroundMusic() {
                if (!audioCtx || musicPlaying) return;
                initAudio();
                musicPlaying = true;
                let currentTime = audioCtx.currentTime;
                let totalDuration = 0;

                MANBA_NOTES.forEach(item => {
                    const [freq, dur] = item;
                    playManbaNote(freq, currentTime + totalDuration, dur);
                    totalDuration += dur;
                });

                function loopMusic() {
                    if (!musicPlaying || !musicToggleState) return;
                    currentTime = audioCtx.currentTime + 0.5;
                    let innerTotal = 0;
                    MANBA_NOTES.forEach(item => {
                        const [freq, dur] = item;
                        playManbaNote(freq, currentTime + innerTotal, dur);
                        innerTotal += dur;
                    });
                    musicSequenceTimeout = setTimeout(loopMusic, (innerTotal + 0.5) * 1000);
                }
                musicSequenceTimeout = setTimeout(loopMusic, (totalDuration + 0.5) * 1000);
            }

            function stopBackgroundMusic() {
                musicPlaying = false;
                if (musicSequenceTimeout) { clearTimeout(musicSequenceTimeout); musicSequenceTimeout = null; }
            }

            function handleKeyDown(e) {
                const key = e.key;
                if (key === ' ') {
                    e.preventDefault();
                    if (!isBoosting) { isBoosting = true; speedIndicator.classList.add('active'); initAudio(); }
                    return;
                }
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(key)) e.preventDefault();
                initAudio();
                if (gameOver) {
                    if (animationFrameId) cancelAnimationFrame(animationFrameId);
                    initGame(); return;
                }
                if (key === 'ArrowUp' && direction !== 'DOWN') nextDirection = 'UP';
                else if (key === 'ArrowDown' && direction !== 'UP') nextDirection = 'DOWN';
                else if (key === 'ArrowLeft' && direction !== 'RIGHT') nextDirection = 'LEFT';
                else if (key === 'ArrowRight' && direction !== 'LEFT') nextDirection = 'RIGHT';
            }

            function handleKeyUp(e) {
                if (e.key === ' ') { e.preventDefault(); isBoosting = false; speedIndicator.classList.remove('active'); }
            }

            musicToggle.addEventListener('click', function (e) {
                e.stopPropagation(); initAudio();
                if (musicToggleState) {
                    musicToggleState = false; musicToggle.textContent = '🔇'; stopBackgroundMusic();
                } else {
                    musicToggleState = true; musicToggle.textContent = '🎵'; startBackgroundMusic();
                }
            });

            if (!CanvasRenderingContext2D.prototype.roundRect) {
                CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
                    if (w < 2 * r) r = w / 2; if (h < 2 * r) r = h / 2;
                    this.beginPath(); this.moveTo(x + r, y);
                    this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
                    this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r);
                    this.closePath(); return this;
                };
            }

            window.addEventListener('load', function () {
                initGame();
                window.addEventListener('keydown', handleKeyDown);
                window.addEventListener('keyup', handleKeyUp);
            });
            window.addEventListener('beforeunload', function () {
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                stopBackgroundMusic();
            });
        })();
    </script>
</body>
</html>
